# ==============================================================================
# Production Nginx Configuration for Swadeshi Kitchen
# Domain: swadeshikitchen.shop | EC2 IP: 43.204.145.203
# ==============================================================================

# 1. HTTP Server Block (Port 80) - Automatically redirects IP and HTTP to HTTPS Domain
server {
    listen 80;
    listen [::]:80;
    server_name swadeshikitchen.shop www.swadeshikitchen.shop 43.204.145.203 _;

    # Redirect all HTTP requests directly to domain HTTPS
    return 301 https://swadeshikitchen.shop$request_uri;
}

# 2. Main HTTPS Server Block (Port 443 - Domain)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name swadeshikitchen.shop www.swadeshikitchen.shop;

    ssl_certificate /etc/letsencrypt/live/swadeshikitchen.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swadeshikitchen.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;
    root /var/www/swadeshikitchen/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. Reverse Proxy API Requests to Node.js Backend (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Reverse Proxy Image Uploads (/uploads/) to Backend Static Storage
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Static Asset Caching for React Build Bundles
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 4. React Single Page Application (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
